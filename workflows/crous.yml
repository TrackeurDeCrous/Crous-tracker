name: Crous Tracker

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Installer le navigateur Playwright
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: Restaurer l'état (logements déjà vus)
        uses: actions/cache@v4
        with:
          path: state/
          key: crous-state-${{ github.run_id }}
          restore-keys: |
            crous-state-

      - name: Lancer le script
        env:
          DISCORD_WEBHOOK_SAULCY: ${{ secrets.DISCORD_WEBHOOK_SAULCY }}
          DISCORD_WEBHOOK_ALL: ${{ secrets.DISCORD_WEBHOOK_ALL }}
          CROUS_SEARCH_URL_SAULCY: ${{ secrets.CROUS_SEARCH_URL_SAULCY }}
          CROUS_SEARCH_URL_ALL: ${{ secrets.CROUS_SEARCH_URL_ALL }}
        run: |
          python main.py